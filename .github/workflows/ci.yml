name: CloudDeploy CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push:

    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # 3. Install backend dependencies
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      # 4. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      # 5. Build frontend
      - name: Build React frontend
        working-directory: Frontend
        run: npm run build

      # 6. Build all Docker images
      - name: Build Docker Compose application
        run: docker compose build

      # 7. Start backend + frontend + database
      - name: Start application
        run: docker compose up -d

      # 8. Give containers time to start
      - name: Wait for services
        run: sleep 10

      # 9. Check containers
      - name: Check running containers
        run: docker compose ps

      # 10. Test backend API
      - name: Backend health check
        run: curl --fail http://localhost:5000/api/health

      # 11. Test frontend
      - name: Frontend health check
        run: curl --fail http://localhost:80



      # 12. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 13. Build backend image
      - name: Build backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-backend:latest \
            ./Backend

      # 14. Push backend image
      - name: Push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-backend:latest

      # 15. Build frontend image
      - name: Build frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-frontend:latest \
            ./Frontend

      # 16. Push frontend image
      - name: Push frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-frontend:latest

      # 17. Deploy to AWS EC2
      - name: Deploy to AWS EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
         mkdir -p ~/.ssh
         ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
         chmod 600 ~/.ssh/known_hosts

         echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key
         chmod 600 ec2_key

         ssh -i ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd ~/clouddeploy-devops
          git pull origin main
          docker compose up -d --build
         EOF

         rm -f ec2_key
      # 18. Clean up test environment
      - name: Stop application
        if: always()
        run: docker compose down -v
