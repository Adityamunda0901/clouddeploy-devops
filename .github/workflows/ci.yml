name: CloudDeploy CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-test-push:

    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # 3. Install backend dependencies
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      # 4. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      # 5. Build frontend
      - name: Build React frontend
        working-directory: Frontend
        run: npm run build

      # 6. Build all Docker images
      - name: Build Docker Compose application
        run: docker compose build

      # 7. Start backend + frontend + database
      - name: Start application
        run: docker compose up -d

      # 8. Give containers time to start
      - name: Wait for services
        run: sleep 10

      # 9. Check containers
      - name: Check running containers
        run: docker compose ps

      # 10. Test backend API
      - name: Backend health check
        run: curl --fail http://localhost:5000/api/health

      # 11. Test frontend
      - name: Frontend health check
        run: curl --fail http://localhost:80



      # 12. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 13. Build backend image
      - name: Build backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-backend:latest \
            ./Backend

      # 14. Push backend image
      - name: Push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-backend:latest

      # 15. Build frontend image
      - name: Build frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-frontend:latest \
            ./Frontend

      # 16. Push frontend image
      - name: Push frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-frontend:latest

          # 17. Deploy to AWS EC2 using SSM
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
         role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
         aws-region: us-east-1

      - name: Deploy to AWS EC2 using SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0599d3cc934be98f2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ubuntu -H bash -lc '\''cd /home/ubuntu/clouddeploy-devops && git pull origin main'\'','\''cd /home/ubuntu/clouddeploy-devops && docker compose up -d --build'\'']' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
           --command-id "$COMMAND_ID" \
           --instance-id "i-0599d3cc934be98f2"

          echo "Deployment completed successfully."

      # 18. Clean up test environment
      - name: Stop application
        if: always()
        run: docker compose down -v
