name: CloudDeploy CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Build application
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Check containers
        run: docker compose ps

      - name: Health check
        run: curl --fail http://localhost:5000/api/health

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-backend:latest ./Backend

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/clouddeploy-backend:latest

      - name: Stop application
        if: always()
        run: docker compose down -v
        run: docker compose down -v

